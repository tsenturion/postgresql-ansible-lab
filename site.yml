- name: Подготовить учебную ноду и установить PostgreSQL из исходников
  hosts: all
  become: true
  vars_files:
    - settings.yml
  tasks:
    - name: Проверить ОС, интерфейсы и наличие открытого ключа
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - nat_interface in ansible_facts.interfaces
          - bridge_interface in ansible_facts.interfaces
          - ssh_public_keys | length > 0
          - postgres_version == '18.6'
        fail_msg: Нужны Ubuntu, два адаптера VirtualBox и настоящий открытый ключ в local.yml.

    - name: Установить системные компоненты, библиотеки сборки и Python
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300
        name:
          - sudo
          - openssh-server
          - netplan.io
          - acl
          - build-essential
          - pkg-config
          - flex
          - bison
          - gettext
          - perl
          - libperl-dev
          - python3
          - python3-dev
          - python3-psycopg2
          - python3-openpyxl
          - python3-reportlab
          - tcl
          - tcl-dev
          - libreadline-dev
          - zlib1g-dev
          - libicu-dev
          - libssl-dev
          - libxml2-dev
          - libxslt1-dev
          - libkrb5-dev
          - libldap-dev
          - libpam0g-dev
          - libsystemd-dev
          - libcurl4-openssl-dev
          - liblz4-dev
          - libzstd-dev
          - uuid-dev
          - libnuma-dev
          - liburing-dev
          - ca-certificates
          - curl
          - tar
        state: present

    - name: Переименовать ноду
      ansible.builtin.hostname:
        name: '{{ node_hostname }}'
        use: systemd

    - name: Обновить локальное разрешение имени ноды
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: '127.0.1.1 {{ node_hostname }}'

    - name: Создать пользователя Ubuntu admin
      ansible.builtin.user:
        name: admin
        shell: /bin/bash
        groups: sudo
        append: true
        password: "{{ admin_password | password_hash('sha512', 'pgLabAdmin2026') }}"
      no_log: true

    - name: Установить учебный пароль root
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512', 'pgLabRoot2026') }}"
      no_log: true

    - name: Разрешить admin выполнять sudo без пароля
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-lab-admin
        content: "admin ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Создать каталоги ключей SSH
      ansible.builtin.file:
        path: '{{ item.home }}/.ssh'
        state: directory
        owner: '{{ item.user }}'
        group: '{{ item.user }}'
        mode: '0700'
      loop:
        - { user: admin, home: /home/admin }
        - { user: root, home: /root }
        - { user: ubuntu, home: /home/ubuntu }

    - name: Добавить открытые ключи Windows в authorized_keys
      ansible.builtin.blockinfile:
        path: '{{ item.home }}/.ssh/authorized_keys'
        create: true
        owner: '{{ item.user }}'
        group: '{{ item.user }}'
        mode: '0600'
        marker: '# {mark} КЛЮЧИ УЧЕБНОЙ НОДЫ'
        block: "{{ ssh_public_keys | join('\n') }}"
      loop:
        - { user: admin, home: /home/admin }
        - { user: root, home: /root }
        - { user: ubuntu, home: /home/ubuntu }

    - name: Создать каталог состояния первичной настройки клона
      ansible.builtin.file:
        path: /var/lib/postgresql-ansible-lab
        state: directory
        mode: '0755'

    - name: Проверить первичную настройку идентификаторов клона
      ansible.builtin.stat:
        path: /var/lib/postgresql-ansible-lab/clone-identity
      register: clone_identity

    - name: Создать отдельные идентификатор машины и ключи SSH для клона
      when: not clone_identity.stat.exists
      block:
        - name: Обновить machine-id клона
          ansible.builtin.shell: |
            rm -f /etc/machine-id /var/lib/dbus/machine-id
            systemd-machine-id-setup
            ln -s /etc/machine-id /var/lib/dbus/machine-id
          args:
            executable: /bin/bash
        - name: Найти унаследованные ключи сервера SSH
          ansible.builtin.find:
            paths: /etc/ssh
            patterns: 'ssh_host_*'
            file_type: file
          register: inherited_host_keys
        - name: Удалить унаследованные ключи сервера SSH
          ansible.builtin.file:
            path: '{{ item.path }}'
            state: absent
          loop: '{{ inherited_host_keys.files }}'
        - name: Создать собственные ключи сервера SSH
          ansible.builtin.command: /usr/bin/ssh-keygen -A
        - name: Отметить завершение первичной настройки идентификаторов
          ansible.builtin.copy:
            dest: /var/lib/postgresql-ansible-lab/clone-identity
            content: "Идентификаторы этого клона созданы.\n"
            mode: '0644'
      # Перезапуск SSH применяется после проверки конфигурации ниже.

    - name: Настроить вход SSH по ключу и паролю для учебной ВМ
      ansible.builtin.template:
        src: templates/sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/00-lab.conf
        mode: '0644'
      register: ssh_configuration

    - name: Проверить конфигурацию SSH
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Включить SSH и перечитать настройки и ключи
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: "{{ 'restarted' if ssh_configuration.changed or not clone_identity.stat.exists else 'started' }}"

    - name: Найти предыдущие настройки Netplan
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: ['*.yaml', '*.yml']
      register: previous_netplan

    - name: Удалить конфликтующие настройки Netplan на учебной ноде
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ previous_netplan.files }}'
      when: item.path != '/etc/netplan/90-lab.yaml'
      register: removed_netplan

    - name: Отключить повторное создание сетевых настроек cloud-init
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        mode: '0644'

    - name: Настроить NAT с DHCP и мост со статическим адресом
      ansible.builtin.template:
        src: templates/netplan.yml.j2
        dest: /etc/netplan/90-lab.yaml
        mode: '0600'
      register: netplan_configuration

    - name: Проверить Netplan
      ansible.builtin.command: /usr/sbin/netplan generate
      changed_when: false

    - name: Применить Netplan
      ansible.builtin.command: /usr/sbin/netplan apply
      when: netplan_configuration.changed or removed_netplan.changed

    - name: Создать системного пользователя PostgreSQL
      ansible.builtin.user:
        name: postgres
        system: true
        home: /var/lib/postgresql
        shell: /bin/bash

    - name: Подготовить каталог исходников
      ansible.builtin.file:
        path: /usr/local/src
        state: directory
        mode: '0755'

    - name: Поместить архив из репозитория в каталог исходников
      ansible.builtin.copy:
        src: postgresql-18.6.tar.gz
        dest: /usr/local/src/postgresql-18.6.tar.gz
        owner: admin
        group: admin
        mode: '0644'

    - name: Распаковать исходники PostgreSQL
      ansible.builtin.unarchive:
        src: /usr/local/src/postgresql-18.6.tar.gz
        dest: /usr/local/src
        remote_src: true
        owner: admin
        group: admin
        creates: '{{ postgres_source }}/configure'

    - name: Проверить параметры предыдущей сборки
      ansible.builtin.slurp:
        src: /var/lib/postgresql-ansible-lab/build-flags
      register: previous_build_flags
      failed_when: false

    - name: Проверить наличие сервера и файлов расширений
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: "{{ [postgres_prefix + '/bin/postgres'] + (postgres_extensions | map('regex_replace', '^(.*)$', postgres_prefix + '/share/extension/\\1.control') | list) }}"
      register: installed_components

    - name: Определить необходимость сборки
      ansible.builtin.set_fact:
        build_required: "{{ (previous_build_flags.content | default('') | b64decode | trim) != (postgres_configure_flags | join(' ')) or (installed_components.results | rejectattr('stat.exists') | list | length > 0) }}"

    - name: Собрать сервер, contrib и процедурные языки
      when: build_required
      block:
        - name: Очистить результаты предыдущей сборки при наличии Makefile
          ansible.builtin.shell: 'if [ -f GNUmakefile ]; then make distclean; fi'
          args:
            chdir: '{{ postgres_source }}'
          become_user: admin
        - name: Настроить сборку PostgreSQL
          ansible.builtin.command:
            argv: "{{ ['./configure'] + postgres_configure_flags }}"
            chdir: '{{ postgres_source }}'
          become_user: admin
        - name: Выполнить make world-bin, включая contrib и PL/Python
          ansible.builtin.command:
            argv: ['make', '-j{{ ansible_facts.processor_vcpus }}', 'world-bin']
            chdir: '{{ postgres_source }}'
          become_user: admin
        - name: Проверить наличие ранее установленной службы
          ansible.builtin.stat:
            path: /etc/systemd/system/postgresql-18.service
          register: existing_service
        - name: Остановить PostgreSQL перед заменой программных файлов
          ansible.builtin.systemd_service:
            name: postgresql-18
            state: stopped
          when: existing_service.stat.exists
        - name: Установить сервер, contrib и PL/Python
          ansible.builtin.command:
            argv: ['make', 'install-world-bin']
            chdir: '{{ postgres_source }}'
        - name: Сохранить параметры выполненной сборки
          ansible.builtin.copy:
            dest: /var/lib/postgresql-ansible-lab/build-flags
            content: "{{ postgres_configure_flags | join(' ') }}\n"
            mode: '0644'

    - name: Добавить PostgreSQL в PATH для интерактивных сеансов
      ansible.builtin.copy:
        dest: /etc/profile.d/postgresql.sh
        mode: '0644'
        content: |
          export PATH={{ postgres_prefix }}/bin:$PATH
          export MANPATH={{ postgres_prefix }}/share/man:${MANPATH:-}

    - name: Создать каталог данных
      ansible.builtin.file:
        path: '{{ postgres_data }}'
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Проверить версию существующего кластера
      ansible.builtin.slurp:
        src: '{{ postgres_data }}/PG_VERSION'
      register: cluster_version
      failed_when: false

    - name: Запретить использование кластера другой основной версии
      ansible.builtin.assert:
        that: "cluster_version.content is not defined or cluster_version.content | b64decode | trim == '18'"
        fail_msg: Найден кластер другой версии. Нужна отдельная миграция данных.

    - name: Инициализировать новый кластер только при отсутствии PG_VERSION
      ansible.builtin.command:
        argv:
          - '{{ postgres_prefix }}/bin/initdb'
          - -D
          - '{{ postgres_data }}'
          - --encoding=UTF8
          - --locale-provider=icu
          - --icu-locale=ru-RU
          - --data-checksums
          - --auth-local=peer
          - --auth-host=scram-sha-256
        creates: '{{ postgres_data }}/PG_VERSION'
      become_user: postgres

    - name: Подключить отдельный файл настроек учебного сервера
      ansible.builtin.lineinfile:
        path: '{{ postgres_data }}/postgresql.conf'
        line: "include_if_exists = 'lab.conf'"
        owner: postgres
        group: postgres
      register: postgres_include

    - name: Настроить PostgreSQL, preload и существующее журналирование
      ansible.builtin.template:
        src: templates/postgresql.conf.j2
        dest: '{{ postgres_data }}/lab.conf'
        owner: postgres
        group: postgres
        mode: '0600'
      register: postgres_configuration

    - name: Настроить peer для Unix-сокета и SCRAM для TCP
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: '{{ postgres_data }}/pg_hba.conf'
        owner: postgres
        group: postgres
        mode: '0600'
      register: postgres_authentication

    - name: Установить службу PostgreSQL
      ansible.builtin.template:
        src: templates/postgresql-18.service.j2
        dest: /etc/systemd/system/postgresql-18.service
        mode: '0644'
      register: postgres_service

    - name: Настроить очистку журналов PostgreSQL через 30 дней
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/postgresql-18.conf
        content: 'd {{ postgres_data }}/log 0700 postgres postgres 30d -'
        mode: '0644'

    - name: Включить регулярную очистку временных файлов и журналов
      ansible.builtin.systemd_service:
        name: systemd-tmpfiles-clean.timer
        enabled: true
        state: started

    - name: Запустить или перезапустить PostgreSQL при изменении его файлов
      ansible.builtin.systemd_service:
        name: postgresql-18
        enabled: true
        daemon_reload: '{{ postgres_service.changed }}'
        state: "{{ 'restarted' if build_required or postgres_include.changed or postgres_configuration.changed or postgres_authentication.changed or postgres_service.changed else 'started' }}"

    - name: Дождаться Unix-сокета PostgreSQL
      ansible.builtin.wait_for:
        path: /tmp/.s.PGSQL.5432
        timeout: 60

    - name: Установить пароль стандартной роли postgres для TCP и DBeaver
      community.postgresql.postgresql_user:
        name: postgres
        password: '{{ postgres_password }}'
        role_attr_flags: SUPERUSER,LOGIN
        login_db: postgres
        login_unix_socket: /tmp
      become_user: postgres
      no_log: true

    - name: Создать расширения в стандартной базе postgres
      community.postgresql.postgresql_ext:
        name: '{{ item }}'
        login_db: postgres
        login_unix_socket: /tmp
        state: present
      loop: '{{ postgres_extensions }}'
      become_user: postgres

    - name: Проверить расширения, dblink и генерацию Excel и PDF через PL/Python
      ansible.builtin.command:
        argv: ['{{ postgres_prefix }}/bin/psql', '-X', '-h', '/tmp', '-d', 'postgres', '-f', '-']
        stdin: "{{ lookup('ansible.builtin.file', 'verify.sql') }}"
      become_user: postgres
      changed_when: false
      register: verification

    - name: Показать результат проверки
      ansible.builtin.debug:
        var: verification.stdout_lines
