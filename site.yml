- name: Подготовить учебную ноду и установить PostgreSQL из исходников
  hosts: all
  become: true
  vars_files:
    - settings.yml
  tasks:
    - name: Проверить ОС, интерфейсы и наличие открытого ключа
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - nat_interface in ansible_facts.interfaces
          - bridge_interface in ansible_facts.interfaces
          - ssh_public_keys | length > 0
          - postgres_version == '18.6'
        fail_msg: Нужны Ubuntu, два адаптера VirtualBox и настоящий открытый ключ в local.yml.

    - name: Установить системные компоненты, библиотеки сборки и Python
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300
        name:
          - sudo
          - openssh-server
          - netplan.io
          - locales
          - chrony
          - acl
          - build-essential
          - pkg-config
          - flex
          - bison
          - gettext
          - perl
          - libperl-dev
          - python3
          - python3-dev
          - python3-psycopg2
          - python3-openpyxl
          - python3-reportlab
          - tcl
          - tcl-dev
          - libreadline-dev
          - zlib1g-dev
          - libicu-dev
          - libssl-dev
          - libxml2-dev
          - libxslt1-dev
          - libkrb5-dev
          - libldap-dev
          - libpam0g-dev
          - libsystemd-dev
          - libcurl4-openssl-dev
          - liblz4-dev
          - libzstd-dev
          - uuid-dev
          - libnuma-dev
          - liburing-dev
          - ca-certificates
          - curl
          - tar
          - bzip2
        state: present

    - name: Выполнить общую настройку Ubuntu, SSH и сети
      ansible.builtin.import_tasks: tasks/node.yml

    - name: Создать системного пользователя PostgreSQL
      ansible.builtin.user:
        name: postgres
        system: true
        home: /var/lib/postgresql
        shell: /bin/bash

    - name: Подготовить каталог исходников
      ansible.builtin.file:
        path: /usr/local/src
        state: directory
        mode: '0755'

    - name: Скачать исходники PostgreSQL с зеркала Яндекса
      ansible.builtin.command:
        argv:
          - /usr/bin/curl
          - --ipv4
          - --fail
          - --location
          - --retry
          - '3'
          - --connect-timeout
          - '15'
          - --max-time
          - '600'
          - --continue-at
          - '-'
          - --output
          - '{{ postgres_archive }}.part'
          - '{{ postgres_source_url }}'
        creates: '{{ postgres_archive }}'
      register: postgres_download

    - name: Завершить сохранение скачанного архива PostgreSQL
      ansible.builtin.command:
        argv: ['/usr/bin/mv', '{{ postgres_archive }}.part', '{{ postgres_archive }}']
      when: postgres_download.changed

    - name: Назначить владельца архива исходников
      ansible.builtin.file:
        path: '{{ postgres_archive }}'
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Распаковать исходники PostgreSQL
      ansible.builtin.unarchive:
        src: '{{ postgres_archive }}'
        dest: /usr/local/src
        remote_src: true
        owner: ubuntu
        group: ubuntu
        creates: '{{ postgres_source }}/configure'

    - name: Проверить владельца существующего каталога исходников
      ansible.builtin.stat:
        path: '{{ postgres_source }}'
        get_checksum: false
      register: postgres_source_owner

    - name: Назначить ubuntu владельцем ранее распакованных исходников
      ansible.builtin.file:
        path: '{{ postgres_source }}'
        owner: ubuntu
        group: ubuntu
        recurse: true
      when: postgres_source_owner.stat.pw_name | default('') != 'ubuntu'

    - name: Проверить параметры предыдущей сборки
      ansible.builtin.slurp:
        src: /var/lib/postgresql-ansible-lab/build-flags
      register: previous_build_flags
      failed_when: false

    - name: Проверить наличие сервера и файлов расширений
      ansible.builtin.stat:
        path: '{{ item }}'
        get_checksum: false
      loop: "{{ [postgres_prefix + '/bin/postgres'] + (postgres_extensions | map('regex_replace', '^(.*)$', postgres_prefix + '/share/extension/\\1.control') | list) }}"
      register: installed_components

    - name: Определить необходимость сборки
      ansible.builtin.set_fact:
        build_required: "{{ (previous_build_flags.content | default('') | b64decode | trim) != (postgres_configure_flags | join(' ')) or (installed_components.results | rejectattr('stat.exists') | list | length > 0) }}"

    - name: Собрать сервер, contrib и процедурные языки
      when: build_required
      block:
        - name: Очистить результаты предыдущей сборки при наличии Makefile
          ansible.builtin.shell: 'if [ -f GNUmakefile ]; then make distclean; fi'
          args:
            chdir: '{{ postgres_source }}'
          become_user: ubuntu
        - name: Настроить сборку PostgreSQL
          ansible.builtin.command:
            argv: "{{ ['./configure'] + postgres_configure_flags }}"
            chdir: '{{ postgres_source }}'
          become_user: ubuntu
        - name: Выполнить make world-bin, включая contrib и PL/Python
          ansible.builtin.command:
            argv: ['make', '-j{{ ansible_facts.processor_vcpus }}', 'world-bin']
            chdir: '{{ postgres_source }}'
          become_user: ubuntu
        - name: Проверить наличие ранее установленной службы
          ansible.builtin.stat:
            path: /etc/systemd/system/postgresql-18.service
            get_checksum: false
          register: existing_service
        - name: Остановить PostgreSQL перед заменой программных файлов
          ansible.builtin.systemd_service:
            name: postgresql-18
            state: stopped
          when: existing_service.stat.exists
        - name: Установить сервер, contrib и PL/Python
          ansible.builtin.command:
            argv: ['make', 'install-world-bin']
            chdir: '{{ postgres_source }}'
        - name: Сохранить параметры выполненной сборки
          ansible.builtin.copy:
            dest: /var/lib/postgresql-ansible-lab/build-flags
            content: "{{ postgres_configure_flags | join(' ') }}\n"
            mode: '0644'

    - name: Добавить PostgreSQL в PATH для интерактивных сеансов
      ansible.builtin.copy:
        dest: /etc/profile.d/postgresql.sh
        mode: '0644'
        content: |
          export PATH={{ postgres_prefix }}/bin:$PATH
          export MANPATH={{ postgres_prefix }}/share/man:${MANPATH:-}

    - name: Создать каталог данных
      ansible.builtin.file:
        path: '{{ postgres_data }}'
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Проверить версию существующего кластера
      ansible.builtin.slurp:
        src: '{{ postgres_data }}/PG_VERSION'
      register: cluster_version
      failed_when: false

    - name: Запретить использование кластера другой основной версии
      ansible.builtin.assert:
        that: "cluster_version.content is not defined or cluster_version.content | b64decode | trim == '18'"
        fail_msg: Найден кластер другой версии. Нужна отдельная миграция данных.

    - name: Инициализировать новый кластер только при отсутствии PG_VERSION
      ansible.builtin.command:
        argv:
          - '{{ postgres_prefix }}/bin/initdb'
          - -D
          - '{{ postgres_data }}'
          - --encoding=UTF8
          - --locale-provider=icu
          - --icu-locale=ru-RU
          - --data-checksums
          - --auth-local=peer
          - --auth-host=scram-sha-256
        creates: '{{ postgres_data }}/PG_VERSION'
      become_user: postgres

    - name: Подключить отдельный файл настроек учебного сервера
      ansible.builtin.lineinfile:
        path: '{{ postgres_data }}/postgresql.conf'
        line: "include_if_exists = 'lab.conf'"
        owner: postgres
        group: postgres
      register: postgres_include

    - name: Настроить PostgreSQL, preload и существующее журналирование
      ansible.builtin.template:
        src: templates/postgresql.conf.j2
        dest: '{{ postgres_data }}/lab.conf'
        owner: postgres
        group: postgres
        mode: '0600'
      register: postgres_configuration

    - name: Настроить peer для Unix-сокета и SCRAM для TCP
      ansible.builtin.template:
        src: templates/pg_hba.conf.j2
        dest: '{{ postgres_data }}/pg_hba.conf'
        owner: postgres
        group: postgres
        mode: '0600'
      register: postgres_authentication

    - name: Установить службу PostgreSQL
      ansible.builtin.template:
        src: templates/postgresql-18.service.j2
        dest: /etc/systemd/system/postgresql-18.service
        mode: '0644'
      register: postgres_service

    - name: Настроить очистку журналов PostgreSQL через 30 дней
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/postgresql-18.conf
        content: 'd {{ postgres_data }}/log 0700 postgres postgres 30d -'
        mode: '0644'

    - name: Включить регулярную очистку временных файлов и журналов
      ansible.builtin.systemd_service:
        name: systemd-tmpfiles-clean.timer
        enabled: true
        state: started

    - name: Запустить или перезапустить PostgreSQL при изменении его файлов
      ansible.builtin.systemd_service:
        name: postgresql-18
        enabled: true
        daemon_reload: '{{ postgres_service.changed }}'
        state: "{{ 'restarted' if build_required or postgres_include.changed or postgres_configuration.changed or postgres_authentication.changed or postgres_service.changed else 'started' }}"

    - name: Дождаться Unix-сокета PostgreSQL
      ansible.builtin.wait_for:
        path: /tmp/.s.PGSQL.5432
        timeout: 60

    - name: Установить пароль стандартной роли postgres для TCP и DBeaver
      community.postgresql.postgresql_user:
        name: postgres
        password: '{{ postgres_password }}'
        role_attr_flags: SUPERUSER,LOGIN
        login_db: postgres
        login_unix_socket: /tmp
      become_user: postgres
      no_log: true

    - name: Создать расширения в стандартной базе postgres
      community.postgresql.postgresql_ext:
        name: '{{ item }}'
        login_db: postgres
        login_unix_socket: /tmp
        state: present
      loop: '{{ postgres_extensions }}'
      become_user: postgres

    - name: Проверить расширения, dblink и генерацию Excel и PDF через PL/Python
      ansible.builtin.command:
        argv: ['{{ postgres_prefix }}/bin/psql', '-X', '-h', '/tmp', '-d', 'postgres', '-f', '-']
        stdin: "{{ lookup('ansible.builtin.file', 'verify.sql') }}"
      become_user: postgres
      changed_when: false
      register: verification

    - name: Показать результат проверки
      ansible.builtin.debug:
        var: verification.stdout_lines
